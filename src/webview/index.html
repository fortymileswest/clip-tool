<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clip Tool</title>
  <script>
    /* WAVEFORM_DATA_PLACEHOLDER */
  </script>
  <style>
    /* FONT_FACE_PLACEHOLDER */
    /* Kerf Studio look: flat shell-grey chrome, dark recessed fields and
       segmented tiles, a near-black glass screen for the waveform, and the
       palette colours kept for what you can move. Values from Kerf Studio's
       studio theme and the Kerf Audio brand. */
    :root {
      --shell:#5c5c5c; --shell-hi:#646464; --shell-lo:#545454;
      --shell-edge:#3a3a3a; --seam:#141414;
      --field:#202020; --field-edge:#111111; --field-hover:#2a2a2a;
      --tile-on:#151515; --row-sel:#262626;
      --screen:#050506; --glass-top:#11151b; --glass-mid:#060708; --glass-bottom:#020203;
      --ink:#f2f2f0; --ink-dim:#d0d0d3; --ink-faint:#9a9a9e;
      --screen-ink:#ececea; --screen-dim:#8d8f95; --screen-faint:#5e6066;
      --accent:#27d0a8; --accent-hi:#3ee0b9; --flag-ink:#121212;
      --cap-top:#3a3b3f; --cap-bottom:#1b1c1f;
      --blue-ink:#8cc8ff;
      --blue:#3aa0ff; --green:#1fb28a; --orange:#ff9d6a; --pink:#ff8fc9; --red:#ff4f6a;
      --sans:'IBM Plex Sans', system-ui, sans-serif;
      --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      --display:'Michroma', 'IBM Plex Sans', sans-serif;
      --tile-h:24px;
      --radius:3px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      font-size: 12px;
      background: var(--shell);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      position: relative;
    }
    button, input { font: inherit; color: inherit; }

    /* Micro-labels: uppercase mono, as Studio's section and field labels. */
    .zoom-label, #zoom-bar label, .control-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    /* Control bar. */
    #header {
      position: relative;
      height: 40px;
      padding: 0 10px;
      border-bottom: 1px solid var(--shell-edge);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #close-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-dim);
      cursor: pointer;
    }
    #close-label:hover { color: var(--ink); }
    .zoom-label { margin-left: auto; }

    #file-name {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 13px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      margin-left: 8px;
      cursor: default;
    }
    #file-name.editing {
      overflow: visible;
      min-width: 140px;
      color: var(--ink);
      background: var(--field);
      outline: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 1px 6px;
      cursor: text;
      text-shadow: none;
    }
    /* Clip facts on a lit glass readout, like Studio's counters: a cool dark
       glass set into the shell, a curved reflection across its top half, and
       the figures glowing through it. */
    #header-meta {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 28px;
      padding: 0 10px;
      background:
        radial-gradient(120% 140% at 50% 120%, rgba(58,160,255,0.10), transparent 60%),
        linear-gradient(180deg, #16202b, var(--glass-mid) 55%, var(--glass-bottom));
      border: 1px solid #000;
      border-radius: 4px;
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.85),
        inset 0 0 0 1px rgba(140,200,255,0.07),
        0 1px 0 rgba(255,255,255,0.12);
      font-family: var(--mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }
    #header-meta::after {
      content: "";
      position: absolute;
      inset: 1px 1px 48% 1px;
      border-radius: 3px 3px 40% 40% / 3px 3px 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
      pointer-events: none;
    }
    #key-label {
      font-family: var(--mono);
      color: var(--screen-ink);
      font-weight: 500;
      display: inline-block;
      width: 112px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
    }
    #key-label:empty { display: none; }
    #duration-label {
      font-family: var(--mono);
      color: var(--blue-ink);
      text-shadow: 0 0 6px rgba(58,160,255,0.45);
      white-space: nowrap;
    }
    #key-label { text-shadow: 0 0 6px rgba(236,236,234,0.25); }

    /* Activity lamp: a small square in the accent, dim until work is running. */
    #led {
      width: 7px; height: 7px;
      border-radius: 1px;
      flex-shrink: 0;
      background: var(--field);
      border: 1px solid var(--field-edge);
      margin-left: 4px;
      transition: background 0.08s ease, box-shadow 0.08s ease;
    }
    #led.on {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 6px rgba(39,208,168,0.8);
    }

    /* Product lockup: the Kerf mark, a Michroma wordmark, version in mono. */
    #logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    #logo .logo-mark { display: block; height: 48px; width: auto; }
    #logo .logo-text { display: flex; flex-direction: column; gap: 8px; }
    .logo-word {
      font-family: var(--display);
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.22em;
      color: var(--ink);
      white-space: nowrap;
    }
    #version {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 11px;
      line-height: 1;
      color: var(--ink-dim);
      letter-spacing: 0.1em;
    }

    /* Close: a small dark tile with a drawn cross. */
    #btn-close {
      position: relative;
      width: 22px; height: 22px;
      border-radius: var(--radius);
      background: var(--field);
      border: 1px solid var(--field-edge);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      font-size: 0;
    }
    #btn-close::before, #btn-close::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 1.5px;
      background: var(--ink-dim);
      border-radius: 1px;
    }
    #btn-close::before { transform: translate(-50%, -50%) rotate(45deg); }
    #btn-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
    #btn-close:hover { background: var(--field-hover); }
    #btn-close:hover::before, #btn-close:hover::after { background: var(--red); }

    /* Tempo and stretch row. */
    #zoom-bar {
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--shell-edge);
      flex-shrink: 0;
    }

    /* Sliders: a recessed well with a lit fill and a light bar thumb. The
       fill position comes from --fill (0..100), set from script. */
    #zoom-slider { flex: none; width: 64px; }
    #zoom-slider, #gain-slider {
      --fill: 0;
      -webkit-appearance: none;
      appearance: none;
      height: 18px;
      background: transparent;
      cursor: pointer;
    }
    #zoom-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--ink-dim) 0 calc(var(--fill) * 1%), var(--seam) 0);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    }
    #zoom-slider::-moz-range-track { height: 6px; border-radius: 1px; background: var(--seam); }
    /* Gain is bipolar: the fill grows from 0 dB at the centre. */
    #gain-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 1px;
      background: linear-gradient(90deg,
        var(--seam) 0 min(50%, calc(var(--fill) * 1%)),
        var(--accent) 0 max(50%, calc(var(--fill) * 1%)),
        var(--seam) 0);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    }
    #gain-slider::-moz-range-track { height: 8px; border-radius: 1px; background: var(--seam); }
    /* Fader caps, as on a mixer: a dark cap in Studio's cap colours, lit
       from above, with a bright line across the middle to read the value by. */
    #zoom-slider::-webkit-slider-thumb,
    #gain-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 22px;
      margin-top: -7px;
      border-radius: 2px;
      border: 1px solid #0c0c0d;
      background:
        linear-gradient(var(--ink), var(--ink)) center / 100% 2px no-repeat,
        linear-gradient(180deg, #4a4b50 0%, var(--cap-top) 18%, var(--cap-bottom) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 3px rgba(0,0,0,0.55);
    }
    #zoom-slider::-webkit-slider-thumb { width: 10px; height: 16px; margin-top: -5px; }
    #zoom-slider::-moz-range-thumb,
    #gain-slider::-moz-range-thumb {
      width: 12px; height: 20px;
      border-radius: 2px;
      border: 1px solid #0c0c0d;
      background:
        linear-gradient(var(--ink), var(--ink)) center / 100% 2px no-repeat,
        linear-gradient(180deg, #4a4b50 0%, var(--cap-top) 18%, var(--cap-bottom) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 3px rgba(0,0,0,0.55);
    }
    #zoom-slider::-moz-range-thumb { width: 8px; height: 14px; }
    #gain-slider { height: 24px; }

    /* Tiles: dark recessed buttons and fields, uppercase mono labels. */
    #zoom-btn-minus, #zoom-btn-plus, #zoom-btn-sel, #zoom-btn-fit,
    #btn-stretch, .channel-btn, .btn, .sel-btn,
    .num-sm, #target-bpm {
      height: var(--tile-h);
      background: var(--field);
      border: 1px solid var(--field-edge);
      color: var(--ink-dim);
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 500;
      white-space: nowrap;
    }
    #zoom-btn-minus, #zoom-btn-plus, #zoom-btn-sel, #zoom-btn-fit, #btn-stretch, .channel-btn, .btn {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #zoom-btn-minus, #zoom-btn-plus, #zoom-btn-sel, #zoom-btn-fit, #btn-stretch { padding: 0 9px; }
    #zoom-btn-minus, #zoom-btn-plus { padding: 0; width: var(--tile-h); font-size: 13px; }
    #zoom-btn-minus:hover, #zoom-btn-plus:hover, #zoom-btn-sel:hover,
    #zoom-btn-fit:hover, #btn-stretch:hover, .channel-btn:hover, .btn:hover, .sel-btn:hover {
      background: var(--field-hover);
      color: var(--ink);
    }
    button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

    /* Latching toggles (Loop, ZC, DC, Clip Guard, Stretch): lit in blue on a
       darker tile, as Studio's latched buttons. */
    .is-on, .is-on:hover {
      background: var(--tile-on) !important;
      color: var(--blue) !important;
      border-color: var(--blue) !important;
      box-shadow: 0 0 6px rgba(58,160,255,0.25);
    }
    .is-error { border-color: var(--red) !important; }

    #bpm-group { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    #stretch-group { display: flex; align-items: center; gap: 6px; }
    .tempo-divider { width: 1px; height: 18px; background: var(--shell-edge); margin: 0 4px; flex-shrink: 0; }
    .num-sm, #target-bpm {
      padding: 0 6px;
      color: var(--ink);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      outline: none;
    }
    .num-sm { width: 40px; }
    #target-bpm { width: 58px; }
    #target-bpm::placeholder { color: var(--ink-faint); opacity: 1; }
    .num-sm:focus, #target-bpm:focus { border-color: var(--accent); }
    #bpm-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      min-width: 84px;
      text-align: right;
      white-space: nowrap;
    }

    /* Number fields: native spinners hidden, a slim stepper column beside. */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    .num { display: inline-flex; align-items: stretch; vertical-align: middle; height: var(--tile-h); }
    .num .num-sm, .num #target-bpm { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
    .num-steps { display: flex; flex-direction: column; width: 14px; }
    .num-up, .num-down {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 0; font-size: 7px; line-height: 1;
      background: var(--field); color: var(--ink-faint);
      border: 1px solid var(--field-edge);
      cursor: pointer; user-select: none;
    }
    .num-up { border-bottom: none; border-radius: 0 var(--radius) 0 0; }
    .num-down { border-radius: 0 0 var(--radius) 0; border-top: 1px solid var(--seam); }
    .num-up:hover, .num-down:hover { background: var(--field-hover); color: var(--ink); }

    /* The screen: black glass, recessed into the shell. */
    #waveform-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 8px 10px 0;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--glass-top), var(--glass-mid) 40%, var(--glass-bottom));
      border: 1px solid #000;
      box-shadow: 0 1px 0 rgba(255,255,255,0.12), inset 0 0 40px rgba(0,0,0,0.55);
    }
    /* Top highlight and a faint diagonal reflection, drawn over the canvas. */
    #waveform-container::before, #waveform-container::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }
    #waveform-container::before {
      left: 8%; right: 8%; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    }
    #waveform-container::after {
      inset: 0;
      background: linear-gradient(112deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.025) 27%, transparent 27.2%);
      opacity: 0.55;
    }
    #waveform-canvas { display: block; cursor: crosshair; background: transparent; }

    #time-bar {
      padding: 4px 12px 0;
      height: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--ink-dim);
      flex-shrink: 0;
    }
    #trim-info { color: var(--ink); }

    #controls {
      --field-w: 360px;
      padding: 10px 12px 10px 14px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      border-top: 1px solid var(--shell-edge);
      margin-top: 6px;
      flex-shrink: 0;
    }
    #control-fields { display: flex; flex-direction: column; gap: 8px; margin-left: auto; min-width: 0; }
    .control-row { display: flex; align-items: center; gap: 10px; }
    .control-label { width: 62px; flex-shrink: 0; margin-left: auto; text-align: right; }
    #gain-slider { width: var(--field-w); flex: 0 1 auto; min-width: 120px; }
    #gain-value {
      width: 64px; text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
    }
    /* Channel: one segmented control, joined tiles, the active one inked. */
    #channel-buttons { width: var(--field-w); flex: 0 1 auto; min-width: 0; display: flex; gap: 0; }
    #channel-buttons .channel-btn { flex: 1; min-width: 0; border-radius: 0; margin-left: -1px; }
    #channel-buttons .channel-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
    #channel-buttons .channel-btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
    .channel-trailing { width: 64px; flex: none; }
    .channel-btn { padding: 0 8px; }
    .channel-btn.active, .channel-btn.active:hover {
      background: var(--tile-on);
      color: var(--ink);
      position: relative;
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    #actions {
      padding: 8px 10px 10px;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      border-top: 1px solid var(--shell-edge);
      flex-shrink: 0;
    }
    .btn { --tile-h: 28px; padding: 0 12px; }
    #btn-loop { margin-right: auto; }
    /* Process: the one lit action. */
    #btn-process {
      background: var(--accent);
      color: var(--flag-ink);
      border-color: #0f7a61;
      font-weight: 600;
      padding: 0 18px;
    }
    #btn-process:hover { background: var(--accent-hi); color: var(--flag-ink); }

    #warning {
      display: none;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 12px;
      background: var(--seam);
      border-top: 1px solid var(--red);
    }

    /* Menus: dark lists, inked on hover, accent tick-bar on the selection. */
    #ctx-menu, .sel-menu {
      background: var(--field);
      border: 1px solid var(--field-edge);
      border-radius: 4px;
      padding: 4px 0;
      box-shadow: 0 8px 18px rgba(0,0,0,0.55);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 12px;
    }
    #ctx-menu {
      display: none;
      position: fixed;
      z-index: 10;
      min-width: 160px;
    }
    .ctx-item { padding: 5px 12px; cursor: pointer; }
    .ctx-item:hover { background: var(--row-sel); }

    /* Visually-hidden native selects, kept as the state source. */
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    /* App-styled dropdown: a picker tile with a chevron. */
    .sel { position: relative; display: inline-block; }
    .sel-btn {
      padding: 0 22px 0 8px;
      min-width: 44px;
      text-align: left;
      color: var(--ink);
      font-size: 11px;
      cursor: pointer;
      position: relative;
    }
    .sel-btn::after {
      content: "";
      position: absolute;
      right: 8px; top: 50%;
      width: 5px; height: 5px;
      border-right: 1.5px solid var(--ink-dim);
      border-bottom: 1.5px solid var(--ink-dim);
      transform: translateY(-70%) rotate(45deg);
    }
    .sel-menu {
      display: none;
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      z-index: 20;
      margin: 0;
      list-style: none;
      min-width: 100%;
      max-height: 220px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
    }
    .sel-opt { padding: 4px 12px; color: var(--ink-dim); cursor: pointer; }
    .sel-opt:hover { background: var(--row-sel); color: var(--ink); }
    .sel-opt.sel-active { color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
    .sel-menu.open { display: block; }

    /* Tiles keep their size; the file name is what gives way. */
    #header > button, #zoom-bar button, #actions .btn, .num, .sel { flex-shrink: 0; }

    /* Narrow windows: tighter tiles so every control still fits on one row. */
    @media (max-width: 880px) {
      #header, #zoom-bar { gap: 4px; padding-left: 8px; padding-right: 8px; }
      #zoom-btn-sel, #zoom-btn-fit, #btn-stretch, .btn { letter-spacing: 0.02em; }
      #zoom-btn-sel, #zoom-btn-fit, #btn-stretch { padding: 0 6px; }
      #zoom-slider { width: 44px; }
      #header-meta { gap: 8px; padding: 0 8px; font-size: 10px; }
      #key-label { width: auto; }
      #zoom-bar label { letter-spacing: 0.04em; }
      .tempo-divider { margin: 0 1px; }
      #bpm-label { min-width: 0; }
      .num-sm { width: 34px; }
      #target-bpm { width: 46px; }
      #actions { gap: 4px; padding-left: 8px; padding-right: 8px; }
      .btn { padding: 0 7px; font-size: 10px; }
      #btn-process { padding: 0 12px; }
      #controls { gap: 10px; }
      .logo-word { font-size: 18px; }
      #logo .logo-mark { height: 40px; }
      .control-label { width: 54px; }
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="close-label">Close</span>
    <button id="btn-close" title="Close (Esc)">×</button>
    <span id="led" role="status" aria-label="Activity" title="Activity"></span>
    <label class="zoom-label">Zoom</label>
    <input id="zoom-slider" type="range" min="1" max="100" value="1" step="0.5">
    <button id="zoom-btn-minus">−</button>
    <button id="zoom-btn-plus">+</button>
    <button id="zoom-btn-sel" title="Zoom to selection">Sel</button>
    <button id="zoom-btn-fit">Fit</button>
    <span id="file-name">Loading…</span>
    <span id="header-meta">
      <span id="key-label" title="Detected key (estimate)"></span>
      <span id="duration-label"></span>
    </span>
  </div>

  <div id="zoom-bar">
    <span id="bpm-group">
      <label>Bars</label>
      <select id="bars-select" class="sr-only" tabindex="-1" aria-hidden="true">
        <option>1</option>
        <option>2</option>
        <option>4</option>
        <option>8</option>
        <option>16</option>
      </select>
      <div class="sel" data-for="bars-select" data-label="Bars"></div>
      <label>Beats</label>
      <select id="beats-select" class="sr-only" tabindex="-1" aria-hidden="true" title="Beats per bar (time signature numerator)">
        <option>2</option>
        <option>3</option>
        <option selected>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
      </select>
      <div class="sel" data-for="beats-select" data-label="Beats" title="Beats per bar (time signature numerator)"></div>
      <span id="bpm-label" title="Detected tempo (or bars × beats over the selection)"></span>
    </span>
    <span class="tempo-divider"></span>
    <span id="stretch-group">
      <label for="pitch-input">Pitch</label>
      <div class="num" data-for="pitch-input">
        <input id="pitch-input" class="num-sm" type="number" min="-24" max="24" step="1" value="0"
          title="Pitch shift in semitones (-24..+24), cyclic / loop-safe">
        <span class="num-steps">
          <button type="button" class="num-up" tabindex="-1" aria-label="Increase">▴</button>
          <button type="button" class="num-down" tabindex="-1" aria-label="Decrease">▾</button>
        </span>
      </div>
      <label for="window-input" title="Grain window (ms) — larger = smoother/cleaner, smaller = grainier">Win</label>
      <div class="num" data-for="window-input">
        <input id="window-input" class="num-sm" type="number" min="2" max="120" step="10" value="48"
          title="Grain window (ms) — larger = smoother/cleaner, smaller = grainier">
        <span class="num-steps">
          <button type="button" class="num-up" tabindex="-1" aria-label="Increase">▴</button>
          <button type="button" class="num-down" tabindex="-1" aria-label="Decrease">▾</button>
        </span>
      </div>
      <label for="transient-input" title="Transient preservation %">Trans</label>
      <div class="num" data-for="transient-input">
        <input id="transient-input" class="num-sm" type="number" min="0" max="100" step="10" value="0"
          title="Transient preservation % (snaps grains to onsets)">
        <span class="num-steps">
          <button type="button" class="num-up" tabindex="-1" aria-label="Increase">▴</button>
          <button type="button" class="num-down" tabindex="-1" aria-label="Decrease">▾</button>
        </span>
      </div>
      <span class="tempo-divider"></span>
      <label for="target-bpm">→</label>
      <div class="num" data-for="target-bpm">
        <input id="target-bpm" type="number" min="20" max="999" step="0.1" placeholder="BPM"
          title="Target BPM for timestretch">
        <span class="num-steps">
          <button type="button" class="num-up" tabindex="-1" aria-label="Increase">▴</button>
          <button type="button" class="num-down" tabindex="-1" aria-label="Decrease">▾</button>
        </span>
      </div>
      <button id="btn-stretch" title="Timestretch the output to the target BPM (pitch preserved, loop-safe)">Stretch: OFF</button>
    </span>
  </div>

  <div id="waveform-container">
    <canvas id="waveform-canvas"></canvas>
  </div>

  <div id="time-bar">
    <span id="time-start">0:00.000</span>
    <span id="trim-info"></span>
    <span id="time-end">0:00.000</span>
  </div>

  <div id="controls">
    <span id="logo" aria-label="Clip Tool v1.0.3">
      <!-- Kerf mark: kerf-audio brand pack, kerf-audio-mark-on-grey.svg -->
      <svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0.00 0.00 258.19 340.00" aria-hidden="true"><g fill="#f2f2f0"><polygon points="61.35,69.02 0.00,122.71 0.00,251.37 61.35,190.01 61.35,69.02"/><polygon points="196.84,253.08 258.19,196.84 258.19,88.63 196.84,149.98 196.84,253.08"/><polygon points="61.35,196.84 5.11,253.08 0.00,258.19 0.00,340.00 194.43,145.57 258.19,81.81 258.19,69.16 258.19,0.00 61.35,196.84"/><polygon points="93.75,253.08 192.01,253.08 192.01,191.73 155.10,191.73 93.75,253.08"/></g></svg>
      <span class="logo-text">
        <span class="logo-word">CLIP TOOL</span>
        <span id="version">v1.0.3</span>
      </span>
    </span>
    <div id="control-fields">
      <div class="control-row">
        <span class="control-label">Gain</span>
        <input id="gain-slider" type="range" min="-18" max="18" value="0" step="0.5">
        <span id="gain-value">0.0 dB</span>
      </div>
      <div class="control-row" id="channel-row">
        <span class="control-label">Channel</span>
        <div id="channel-buttons">
          <button class="channel-btn" data-ch="left">Left</button>
          <button class="channel-btn" data-ch="right">Right</button>
          <button class="channel-btn" data-ch="mixed">Mixed</button>
          <button class="channel-btn active" data-ch="stereo">Stereo</button>
          <button class="channel-btn" data-ch="side">Side</button>
        </div>
        <span class="channel-trailing"></span>
      </div>
    </div>
  </div>

  <div id="warning"></div>

  <div id="ctx-menu">
    <div class="ctx-item" id="ctx-loop-sel">Loop Selection</div>
    <div class="ctx-item" id="ctx-clear-sel">Clear Selection</div>
    <div class="ctx-item" id="ctx-clear-loop">Clear Loop</div>
    <div class="ctx-item fade-item" data-curve="linear">Linear</div>
    <div class="ctx-item fade-item" data-curve="exp">Exponential</div>
    <div class="ctx-item fade-item" data-curve="log">Logarithmic</div>
    <div class="ctx-item fade-item" data-curve="s">S-Curve</div>
    <div class="ctx-item" id="ctx-clear-fade">Remove Fade</div>
  </div>

  <div id="actions">
    <button class="btn" id="btn-preview">▶ Preview</button>
    <button class="btn" id="btn-loop">Loop: OFF</button>
    <button class="btn" id="btn-trim">Trim to Selection</button>
    <button class="btn" id="btn-zc" title="Snap start/end points to zero crossings">ZC</button>
    <button class="btn" id="btn-dc" title="Remove DC offset (applied on Process / Copy)">DC</button>
    <button class="btn" id="btn-clipguard" title="Prevent clipping: scale the result down if it would exceed 0 dBFS (on by default)">Clip Guard</button>
    <button class="btn" id="btn-copy">Copy to Arrangement</button>
    <button class="btn" id="btn-simpler">→ Simpler</button>
    <button class="btn" id="btn-process">Process</button>
  </div>

  <script src="timestretch.js"></script>
  <script src="fades.js"></script>
  <script src="waveform.js"></script>
  <script src="controls.js"></script>
</body>
</html>
